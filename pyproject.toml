[project]
name = "pyasmobelt"
version = "0.1.2"
description = "Personal CLI toolbox (collect files, add path comments, and more)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Askhat Molkenov", email = "asmokah.molkenov@gmail.com" }
]

# If your tools someday need deps, add here
dependencies = [
]

# This section defines the console script named `asmobelt`
[project.scripts]
asmobelt = "asmobelt.cli:cli"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
